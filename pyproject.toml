[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finance-job-archive"
version = "0.1.0"
description = "개인용 금융 채용공고 수집 및 검색 도구"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "pymysql>=1.1,<2",
    "requests>=2.31",
    "starlette>=0.47.2,<1",
    "streamlit>=1.35",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
